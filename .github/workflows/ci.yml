name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Debug Secrets Availability
      run: |
        echo "=== Secret Status ==="
        echo "HTTP_URL secret exists: ${{ secrets.HTTP_URL != '' }}"
        echo "RPC_URL secret exists: ${{ secrets.RPC_URL != '' }}"
        echo "WSS_URL secret exists: ${{ secrets.WSS_URL != '' }}"
        echo ""
        echo "=== Environment Variables ==="
        echo "HTTP_URL env length: ${#HTTP_URL}"
        echo "RPC_URL env length: ${#RPC_URL}"
        echo "WSS_URL env length: ${#WSS_URL}"
        echo ""
        echo "=== All Environment Variables Starting with 'HTTP' or 'RPC' ==="
        env | grep -E '^(HTTP|RPC|WSS)' || echo "None found"
      env:
        HTTP_URL: ${{ secrets.HTTP_URL }}
        RPC_URL: ${{ secrets.RPC_URL }}
        WSS_URL: ${{ secrets.WSS_URL }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Check Formatting
      run: cargo fmt --all -- --check

    - name: Run Clippy
      run: cargo clippy --workspace -- -D warnings

    - name: Run Tests
      run: cargo test --workspace -- --nocapture
      env:
        RUST_BACKTRACE: 1
        HTTP_URL: ${{ secrets.HTTP_URL }}
        RPC_URL: ${{ secrets.RPC_URL }}
        WSS_URL: ${{ secrets.WSS_URL }}
